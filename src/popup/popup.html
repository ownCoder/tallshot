<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tallshot</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="pop">
      <header class="pop__head">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="tsMark" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#9B85FF" />
                <stop offset="1" stop-color="#5B3FE0" />
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#tsMark)" />
            <rect x="10" y="-2" width="12" height="24" rx="2.5" fill="#fff" opacity=".95" />
            <rect x="12.5" y="4" width="7" height="1.6" rx=".8" fill="#5B3FE0" opacity=".55" />
            <rect x="12.5" y="7.6" width="5" height="1.6" rx=".8" fill="#5B3FE0" opacity=".55" />
            <rect x="12.5" y="11.2" width="7" height="1.6" rx=".8" fill="#5B3FE0" opacity=".55" />
            <path
              d="M16 21.5 L21 26.5 L11 26.5 Z"
              fill="#FFB020"
            />
          </svg>
          <span class="brand__name">Tallshot</span>
        </div>
        <button
          class="iconbtn"
          id="openOptions"
          type="button"
          title="Settings"
          aria-label="Open Tallshot settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3.2" />
            <path
              d="M19.4 13.5a7.7 7.7 0 0 0 0-3l1.7-1.3-1.9-3.3-2 .8a7.6 7.6 0 0 0-2.6-1.5L14.3 3h-3.8l-.3 2.2a7.6 7.6 0 0 0-2.6 1.5l-2-.8L3.7 9.2l1.7 1.3a7.7 7.7 0 0 0 0 3l-1.7 1.3 1.9 3.3 2-.8a7.6 7.6 0 0 0 2.6 1.5l.3 2.2h3.8l.3-2.2a7.6 7.6 0 0 0 2.6-1.5l2 .8 1.9-3.3z"
            />
          </svg>
        </button>
      </header>

      <div class="pop__actions">
        <button class="capture capture--primary" id="btnFull" type="button" data-mode="full">
          <span class="capture__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="5" y="2.5" width="14" height="19" rx="2.5" />
              <path d="M9 8h6M9 12h4M9 16h6" />
            </svg>
          </span>
          <span class="capture__text">
            <span class="capture__title">Full page</span>
            <span class="capture__sub">Everything, top to bottom</span>
          </span>
          <kbd class="capture__key">Alt ⇧ F</kbd>
        </button>

        <button class="capture" id="btnVisible" type="button" data-mode="visible">
          <span class="capture__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
            </svg>
          </span>
          <span class="capture__text">
            <span class="capture__title">Visible area</span>
            <span class="capture__sub">What's on screen now</span>
          </span>
          <kbd class="capture__key">Alt ⇧ V</kbd>
        </button>

        <button class="capture" id="btnRegion" type="button" data-mode="region">
          <span class="capture__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M3 8V4.5A1.5 1.5 0 0 1 4.5 3H8" />
              <path d="M16 3h3.5A1.5 1.5 0 0 1 21 4.5V8" />
              <path d="M21 16v3.5a1.5 1.5 0 0 1-1.5 1.5H16" />
              <path d="M8 21H4.5A1.5 1.5 0 0 1 3 19.5V16" />
              <rect x="8" y="8" width="8" height="8" rx="1" />
            </svg>
          </span>
          <span class="capture__text">
            <span class="capture__title">Select region</span>
            <span class="capture__sub">Drag to choose an area</span>
          </span>
          <kbd class="capture__key">Alt ⇧ R</kbd>
        </button>
      </div>

      <div class="pop__note" id="note" role="status" aria-live="polite" hidden></div>

      <footer class="pop__foot">
        <label class="after" for="afterCapture">
          <span class="after__label">After capture</span>
          <select id="afterCapture" class="after__select">
            <option value="editor">Open editor</option>
            <option value="download">Download</option>
            <option value="clipboard">Copy to clipboard</option>
          </select>
        </label>
        <p class="privacy">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="privacy__icon">
            <path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.4 7.5 9.5 4.4-1.1 7.5-4.9 7.5-9.5V6z" />
            <path d="M9.2 12.2 11 14l4-4.2" />
          </svg>
          Everything stays on this device.
        </p>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
